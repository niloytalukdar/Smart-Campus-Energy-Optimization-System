<!DOCTYPE html>
<html>
<head>
<title>GridWise Test</title>
<style>
body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
.card { background: #12141a; border-radius: 12px; padding: 24px; width: 100%; max-width: 480px; }
textarea { width: 100%; height: 100px; box-sizing: border-box; margin-bottom: 16px; font-family: inherit; }
button { height: 44px; width: 100%; background: #3b82f6; color: white; border-radius: 8px; border: none; cursor: pointer; }
button:hover { background: #2563eb; }
pre { background: #0a0b0d; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 13px; overflow: auto; max-height: 400px; white-space: pre-wrap; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>GridWise Test</h2>
  <textarea id="notes" placeholder="Enter operator notes, one per line"></textarea>
  <button id="runBtn">Run Optimization</button>
  <pre id="output"></pre>
</div>

<script>
document.getElementById('runBtn').addEventListener('click', async () => {
    const notesStr = document.getElementById('notes').value;
    const notes = notesStr.split('\n').map(n => n.trim()).filter(n => n);
    
    const hours = [];
    for (let i = 0; i < 24; i++) {
        hours.push({
            hour: i,
            demand_kwh: 20.0,
            solar_kwh: (i >= 8 && i <= 17) ? 10.0 : 0.0,
            price: (i < 12) ? 0.1 : 0.5
        });
    }

    const req = {
        scenario_id: "GRID-101",
        operator_notes: notes,
        battery: {
            capacity_kwh: 100.0,
            initial_energy_kwh: 50.0,
            max_charge_rate_kwh: 25.0,
            max_discharge_rate_kwh: 25.0,
            charge_efficiency: 0.95,
            discharge_efficiency: 0.95
        },
        hours: hours
    };

    const out = document.getElementById('output');
    out.innerText = "Loading...";

    try {
        const res = await fetch('/optimize-energy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(req)
        });
        const data = await res.json();
        out.innerText = JSON.stringify(data, null, 2);
    } catch (e) {
        out.innerText = String(e);
    }
});
</script>
</body>
</html>
